[build-system]
requires = [
    "hatchling",
    "grpcio-tools>=1.62.0",  # Only needed during build time to run protoc
]
build-backend = "hatchling.build"

[project]
name = "opencue_proto"
dynamic = ["version"]
dependencies = [
    "protobuf>=5.0.0",       # Only runtime dependency needed
    "h2>=4.0.0",
]
requires-python = ">3.7"
description = "The opencue-proto is a module containing the protobuf modules for communication to and from Cuebot."
readme = "README.md"
license = {text = "Apache-2.0"}

[tool.pylint.typecheck]
ignored-classes = ["DynamicStub"]

[tool.hatch.version]
source = "code"
path = "../ci/generate_version_number.py"
default-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["opencue_proto"]

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"
