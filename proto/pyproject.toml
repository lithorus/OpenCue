[build-system]
requires = [
    "hatchling",
    "grpcio-tools==1.62.3",
]
build-backend = "hatchling.build"

[project]
name = "opencue_proto"
dynamic = ["version"]
dependencies = [
    "protobuf>=4.21.6,<5.0dev",
    "h2>=4.0.0",
]
requires-python = ">=3.9"
description = "The opencue-proto is a module containing the protobuf modules for communication to and from Cuebot."
readme = "README.md"
license = {text = "Apache-2.0"}

[tool.pylint.typecheck]
ignored-classes = ["DynamicStub"]

[tool.hatch.version]
source = "code"
path = "../ci/generate_version_number.py"
default-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["opencue_proto"]

[tool.hatch.build.hooks.custom]
path = "build_hooks.py"
